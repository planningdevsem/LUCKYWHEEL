<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BETMA LUCKY WHEEL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--red:#D3222B;--dark:#7d0f15;--gold:#f5c542}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Segoe UI,Roboto,sans-serif;overflow:hidden}
body{background:linear-gradient(135deg,#8e1118,#D3222B,#a3151c,#D3222B);background-size:400% 400%;animation:bg 14s ease infinite;color:#222}
@keyframes bg{50%{background-position:100% 50%}}
.b{position:fixed;bottom:-90px;color:#fff;font-weight:800;letter-spacing:2px;white-space:nowrap;border:2px solid rgba(255,255,255,.55);border-radius:999px;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.35),rgba(255,255,255,.06));box-shadow:0 0 18px rgba(255,215,90,.55),inset 0 0 14px rgba(255,255,255,.25);text-shadow:0 0 10px #ffd75a;opacity:0;pointer-events:none;z-index:0;animation:rise linear forwards}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:.5}85%{opacity:.35}100%{transform:translate(var(--dx),-120vh);opacity:0}}
#demo{position:fixed;left:8px;bottom:8px;z-index:50;background:#222;color:#ffd75a;font-size:12px;padding:4px 10px;border-radius:6px}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
header{background:#fff;display:flex;align-items:center;gap:20px;padding:8px 24px;border-bottom:4px solid var(--gold)}
header img{height:56px;max-width:180px;object-fit:contain}header img[src=""]{display:none}
.ht{flex:1;text-align:center}.ht h1{margin:0;color:var(--red);font-size:clamp(24px,3vw,44px);letter-spacing:2px}
.ht p{margin:2px 0 0;color:#555;font-size:clamp(13px,1.3vw,20px)}
.tools button{background:none;border:1px solid #ccc;border-radius:8px;font-size:20px;padding:6px 10px;cursor:pointer;margin-left:6px}
main{flex:1;display:flex;min-height:0}
#left{width:30%;padding:20px;display:flex;align-items:center}
.card{background:#fff;border-radius:18px;padding:24px;width:100%;box-shadow:0 10px 40px #0005}
.card h2{margin:0;color:var(--red);font-size:clamp(18px,1.6vw,26px)}.card p.s{margin:6px 0 16px;color:#666}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 4px}
input{width:100%;padding:14px;font-size:18px;border:2px solid #ddd;border-radius:10px}input:focus{outline:none;border-color:var(--red)}
.cta{width:100%;margin-top:20px;padding:18px;font-size:20px;font-weight:800;color:#fff;background:var(--red);border:0;border-radius:12px;cursor:pointer}
.cta:disabled{background:#bbb;cursor:not-allowed}
.msg{margin-top:12px;font-weight:600;min-height:22px;color:var(--red)}.msg.ok{color:#168a3a}
#right{width:70%;display:flex;align-items:center;justify-content:center;position:relative}
#wrap{position:relative;height:min(100%,78vw*.7);aspect-ratio:1;max-height:calc(100vh - 110px);padding:10px}
#wrap.go{filter:drop-shadow(0 0 30px #ffd75a)}
#wheel{width:100%;height:100%;transition:transform 6s cubic-bezier(.12,.6,.1,1)}
#ptr{position:absolute;left:50%;top:-2px;transform:translateX(-50%);font-size:0;width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;border-top:60px solid var(--gold);filter:drop-shadow(0 3px 3px #0008);z-index:3}
#spin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:23%;aspect-ratio:1;border-radius:50%;border:6px solid var(--gold);background:var(--red);color:#fff;font-weight:900;font-size:clamp(14px,1.8vw,28px);cursor:pointer;z-index:3}
#spin:disabled{background:#999;cursor:not-allowed}#spin:not(:disabled){animation:pu 1.2s infinite}
@keyframes pu{50%{box-shadow:0 0 0 14px #ffd75a66}}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20}
#modal .box{background:#fff;border-radius:24px;padding:40px 60px;text-align:center;max-width:720px;border:6px solid var(--gold)}
#modal h2{color:var(--red);font-size:44px;margin:0}#modal .big{font-size:clamp(32px,4vw,56px);font-weight:900;color:var(--red);margin:14px 0}
#modal .ic{min-height:100px}#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
#admin{display:none;position:fixed;inset:0;background:#f4f4f4;z-index:40;overflow:auto;padding:20px}
#admin table{border-collapse:collapse;width:100%;background:#fff}#admin td,#admin th{border:1px solid #ddd;padding:6px 8px;font-size:14px;text-align:left}
#admin input,#admin select{padding:6px;font-size:14px;width:auto;border:1px solid #ccc;border-radius:6px}
#admin button{padding:8px 14px;margin:2px;border:0;border-radius:8px;background:var(--red);color:#fff;cursor:pointer}
.stat{display:inline-block;background:#fff;border-left:5px solid var(--red);padding:12px 18px;margin:5px;border-radius:8px;min-width:180px}.stat b{font-size:26px;display:block}
@media(max-width:900px){#left{width:36%}#right{width:64%}}
</style></head><body>
<div id="app">
<header><img id="l1" alt=""><img id="l2" alt="">
<div class="ht"><h1 id="title">BETMA LUCKY WHEEL</h1><p>Tham gia ngay – Quay may mắn – Nhận quà hấp dẫn!</p></div>
<div class="tools"><button id="snd" title="Âm thanh">🔊</button><button id="fs" title="Toàn màn hình">⛶</button><button id="adm" title="Admin" style="opacity:.35">⚙</button></div></header>
<main>
<section id="left"><div class="card">
<h2>THÔNG TIN NGƯỜI THAM GIA</h2><p class="s">Điền thông tin để nhận 01 lượt quay may mắn.</p>
<label>HỌ VÀ TÊN</label><input id="fn" placeholder="Nhập họ và tên của bạn">
<label>KHOA / VIỆN</label><input id="fa" placeholder="Nhập Khoa/Viện của bạn">
<label>SỐ ĐIỆN THOẠI</label><input id="ph" type="tel" placeholder="Nhập số điện thoại">
<button class="cta" id="reg">🎁 NHẬN 01 LƯỢT QUAY</button><div class="msg" id="msg"></div>
</div></section>
<section id="right"><div id="wrap"><div id="ptr"></div><svg id="wheel" viewBox="-250 -250 500 500"></svg><button id="spin" disabled>QUAY NGAY</button></div></section>
</main></div>
<div id="modal"><div class="box"><h2>CHÚC MỪNG BẠN!</h2><p>PHẦN QUÀ BẠN NHẬN ĐƯỢC LÀ:</p><div class="ic" id="mi"></div><div class="big" id="mn"></div><p id="mx"></p>
<button class="cta" id="ok">XÁC NHẬN NHẬN QUÀ</button></div></div>
<canvas id="confetti"></canvas>
<div id="admin"></div>

const SUPABASE_URL="https://YOUR-PROJECT.supabase.co", SUPABASE_KEY="YOUR-ANON-KEY";
const DEMO=SUPABASE_URL.includes("YOUR-");
function mockSb(){ // CHẾ ĐỘ DEMO: dữ liệu lưu trong trình duyệt, chỉ để xem thử
 const D=JSON.parse(localStorage.getItem("betma_demo")||"null")||{prizes:[
  {id:1,name:"SỔ TAY",unlimited:false,initial_qty:20,awarded:0,weight:20,active:true},
  {id:2,name:"MÓC KHÓA",unlimited:true,initial_qty:null,awarded:0,weight:40,active:true},
  {id:3,name:"LY SỨ",unlimited:false,initial_qty:10,awarded:0,weight:20,active:true},
  {id:4,name:"KHÓA HỌC TIẾNG ANH CHUYÊN NGÀNH",unlimited:true,initial_qty:null,awarded:0,weight:20,active:true}],parts:[]};
 const save=()=>localStorage.setItem("betma_demo",JSON.stringify(D));
 const avail=()=>D.prizes.filter(p=>p.active&&p.weight>0&&(p.unlimited||p.awarded<p.initial_qty));
 const R={register:({p_name,p_faculty,p_phone})=>{const ph=(p_phone||"").replace(/\D/g,"");
   if(!p_name||!p_faculty)return{error:"missing"};if(!/^0\d{9,10}$/.test(ph))return{error:"bad_phone"};
   let r=D.parts.find(x=>x.phone===ph);if(r)return r.status==="registered"?{id:r.id}:{error:"duplicate"};
   r={id:crypto.randomUUID(),full_name:p_name,faculty:p_faculty,phone:ph,joined_at:new Date().toISOString(),spin_code:Math.random().toString(36).slice(2,10).toUpperCase(),prize_id:null,status:"registered"};
   D.parts.unshift(r);save();return{id:r.id}},
  spin:({p_id})=>{const r=D.parts.find(x=>x.id===p_id);if(!r)return{error:"not_found"};
   if(r.prize_id){const p=D.prizes.find(x=>x.id===r.prize_id);return{prize_id:p.id,name:p.name,again:true}}
   const a=avail();if(!a.length)return{error:"no_prize"};let x=Math.random()*a.reduce((s,p)=>s+p.weight,0),c=a[a.length-1];
   for(const p of a){x-=p.weight;if(x<=0){c=p;break}}
   c.awarded++;r.prize_id=c.id;r.status="spun";save();return{prize_id:c.id,name:c.name}},
  confirm_prize:({p_id})=>{const r=D.parts.find(x=>x.id===p_id);if(r&&r.status==="spun")r.status="received";save();return null},
  reset_event:()=>{D.parts=[];D.prizes.forEach(p=>p.awarded=0);save();return null},
  remove_participant:({p_id})=>{D.parts=D.parts.filter(x=>x.id!==p_id);save();return null}};
 const from=t=>{const q={op:"sel",select:()=>q,order:()=>q,update:u=>{q.op="upd";q.u=u;return q},eq:(k,v)=>{q.v=v;return q},
  then:res=>res(q.op==="upd"?(Object.assign(D.prizes.find(p=>p.id===q.v),q.u),save(),{error:null}):
   {data:t==="prizes"?D.prizes:D.parts.map(r=>({...r,prize:D.prizes.find(p=>p.id===r.prize_id)||null}))})};return q};
 const b=document.createElement("div");b.id="demo";b.textContent="CHẾ ĐỘ DEMO – dữ liệu lưu trên trình duyệt (điền Supabase key để chạy thật)";document.body.appendChild(b);
 return{rpc:async(n,a)=>({data:R[n](a)}),from,auth:{getSession:async()=>({data:{session:{}}}),signInWithPassword:async()=>({}),signOut:async()=>{}}}}

function bubble(){const d=document.createElement("span");d.className="b";d.textContent="BETMA ENGLISH";const s=14+Math.random()*34,dur=9+Math.random()*10;
 d.style.cssText=`left:${Math.random()*90}vw;font-size:${s}px;padding:${s*.35}px ${s*.8}px;--dx:${(Math.random()-.5)*180}px;animation-duration:${dur}s`;

let ac;function beep(f,d,t="square",v=.08){if(!sound)return;ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}
const win=()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.4,"triangle",.15),i*160));

function pt(a,r){a=a*Math.PI/180;return[r*Math.sin(a),-r*Math.cos(a)]}
function draw(){let h=`<circle r="248" fill="#f5c542"/><circle r="238" fill="#fff"/>`,N=8,A=360/N;
 for(let i=0;i<N;i++){const k=i%4,a0=i*A,a1=a0+A,[x0,y0]=pt(a0,230),[x1,y1]=pt(a1,230),c=a0+A/2,red=i%2===0;
  h+=`<path d="M0 0L${x0} ${y0}A230 230 0 0 1 ${x1} ${y1}Z" fill="${red?"#D3222B":"#fff"}" stroke="#f5c542" stroke-width="3"/>
  <g transform="rotate(${c})"><image href="${IMG[k]}" x="-58" y="-185" width="116" height="116" preserveAspectRatio="xMidYMid meet"/></g>`}
 h+=Array.from({length:24},(_,i)=>{const[x,y]=pt(i*15,243);return`<circle cx="${x}" cy="${y}" r="4" fill="#D3222B"/>`}).join("");
 $("#wheel").innerHTML=h}
function spinTo(idx){return new Promise(res=>{
 const w=$("#wheel"),target=360*8-(idx*45+22.5)+(Math.random()*26-13);rot=Math.ceil(rot/360)*360+target;
 $("#wrap").classList.add("go");beep(300,.3,"sawtooth");
 let last=-1;const t=setInterval(()=>{const m=new DOMMatrix(getComputedStyle(w).transform),a=(Math.atan2(m.b,m.a)*180/Math.PI+360)%360,k=Math.floor(a/45);if(k!==last){last=k;beep(900,.04)}},30);
 w.style.transform=`rotate(${rot}deg)`;
 setTimeout(()=>beep(220,1.5,"sine",.1),4500);
 w.addEventListener("transitionend",()=>{clearInterval(t);$("#wrap").classList.remove("go");res()},{once:true})})}

$("#reg").onclick=async()=>{
 const n=$("#fn").value.trim(),f=$("#fa").value.trim(),p=$("#ph").value.trim();
 if(!n||!f||!p)return msg("Vui lòng nhập đầy đủ cả 3 thông tin.");
 $("#reg").disabled=true;const{data,error}=await sb.rpc("register",{p_name:n,p_faculty:f,p_phone:p});$("#reg").disabled=false;
 if(error)return msg("Lỗi kết nối, vui lòng thử lại.");
 const E={missing:"Vui lòng nhập đầy đủ thông tin.",bad_phone:"Số điện thoại không hợp lệ.",duplicate:"Số điện thoại này đã tham gia trước đó. Mỗi số chỉ nhận 01 lượt quay."};
 if(data.error)return msg(E[data.error]||"Có lỗi xảy ra.");
 pid=data.id;msg("Xác nhận thành công! Hãy bấm QUAY NGAY.",true);$("#spin").disabled=false;["fn","fa","ph"].forEach(i=>$("#"+i).disabled=true);$("#reg").disabled=true};
$("#spin").onclick=async()=>{
 if(!pid||busy)return;busy=true;$("#spin").disabled=true;
 const{data,error}=await sb.rpc("spin",{p_id:pid});
 if(error||data.error){busy=false;return msg("Không thể quay lúc này, vui lòng báo nhân viên.")}
 const idx=prizes.findIndex(p=>p.id===data.prize_id),sl=idx+4*(Math.random()<.5?0:1);await spinTo(sl);win();confetti();
 $("#mi").innerHTML=`<img src="${IMG[idx]}" style="max-height:200px;max-width:100%">`;$("#mn").textContent=data.name;$("#mx").textContent=idx===3?COURSE:"";$("#modal").style.display="flex"};
$("#ok").onclick=async()=>{await sb.rpc("confirm_prize",{p_id:pid});$("#modal").style.display="none";
 msg("Cảm ơn bạn đã tham gia BETMA LUCKY WHEEL!",true);pid=null;busy=false;
 setTimeout(()=>{["fn","fa","ph"].forEach(i=>{$("#"+i).disabled=false;$("#"+i).value=""});$("#reg").disabled=false;msg("")},5000)};

function confetti(){const c=$("#confetti"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
 const a=Array.from({length:180},()=>({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*22,vy:-Math.random()*20,c:["#D3222B","#fff","#f5c542"][Math.random()*3|0],s:5+Math.random()*7}));let f=0;
 (function t(){x.clearRect(0,0,c.width,c.height);a.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s*.6)});if(++f<130)requestAnimationFrame(t);else x.clearRect(0,0,c.width,c.height)})()}
